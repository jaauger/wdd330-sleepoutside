<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <form action="form-action.html" method="get">
        <label>
          First Name:
          <input type="text" name="fname" required>
        </label>
      
        <label> 
          Last Name:
          <input type="text" name="lname" required>
        </label>
      
        <label>
          Street Address:
          <input type="text" name="saddress" required>
        </label>
      
        <label>
          City:
          <input type="text" name="city" required>
        </label>

        <label>
          State:
          <input type="text" name="state" required>
        </label>

        <label>
          Zip Code:
          <input type="text" name="zip" required>
        </label>
        
        <label>
          Credit Card Number:
          <input type="text" name="cardnum" required>
        </label>

        <label>
          Expiration Date:
          <input type="text" name="expdate" required>
        </label>

        <label>
          Security Code:
          <input type="text" name="code" required>
        </label>





        <button type="submit">Checkout Now!</button>
      </form>
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
